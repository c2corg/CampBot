name: continuous-delivery

# Publishes to PyPI when a version tag is pushed (e.g. v2.0.1). Uses PyPI
# trusted publishing: no token is stored in this repository, PyPI trusts this
# workflow (see the "Publishing" settings of the campbot project on PyPI).
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the version in the source matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'exec(open("campbot/version.py").read()); print(__version__)')"
          echo "Tag: $tag, source version: $version"
          test "$tag" = "$version"
      - name: Build package
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
